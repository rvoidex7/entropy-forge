[package]
name = "entropy-forge"
version = "0.2.0"
edition = "2021"
authors = ["rvoidex7"]
license = "MIT"
description = "Pluggable entropy framework with quality testing and visualization"
repository = "https://github.com/rvoidex7/entropy-forge"
keywords = ["cryptography", "entropy", "rng", "visualization", "nist"]
categories = ["cryptography", "visualization"]

[lib]
name = "entropy_forge"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Crypto
rand = "0.10"
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
chacha20 = "0.10"

# Math & Stats
statrs = "0.18"

# GUI (optional)
egui = { version = "0.37", optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "glow",
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
# Decodes the bundled PNG icon into RGBA for the window icon and header.
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
] }

# Utilities
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"
egui_kittest = { version = "0.37", features = ["eframe"] }

# Embeds assets/icons/icon.ico into the Windows executable. Build-time only and
# only when compiling for Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:image"]

[[bin]]
name = "entropy-forge"
path = "src/main.rs"
required-features = ["gui"]

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "custom_source"
path = "examples/custom_source.rs"

[[example]]
name = "quality_check"
path = "examples/quality_check.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
