name: Build release assets

# Builds desktop binaries and attaches them to the release for a tag.
#
# Two ways to trigger it:
#   * push a version tag  -> automatic
#   * Actions -> Run workflow -> rebuild an existing tag (e.g. v0.2.0)
#
# This workflow does not wait for "Release notes". The binaries are the real
# deliverable, so this job creates the release itself (notes come from the same
# CHANGELOG.md section) when the notes workflow is slow, failed, or never ran.
# Both workflows are idempotent: whichever creates the release first wins and
# the other one edits/attaches to it, so the two can run in parallel.
#
# Standard runners are free for public repositories, so per-release builds cost
# nothing. A failed build only leaves a red run behind; the release keeps its
# notes and simply gets no assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build for (e.g. v0.2.0)
        required: true
        type: string

# Only the attach job writes. The build job compiles and uploads workflow
# artifacts, which needs no repository write access.
permissions:
  contents: read

# Two dispatches for the same tag would otherwise build and upload in parallel.
# Never cancel a release mid-upload; queue instead.
concurrency:
  group: build-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Explicit repository so every `gh` call works even if a job ever runs
  # without a checkout (no local remote to infer it from).
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu keeps the glibc requirement low; the binary
          # then runs on newer distributions too.
          - os: ubuntu-22.04
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: |
          # Tags created before the lock file was tracked (v0.2.0 and older)
          # have no Cargo.lock, so --locked would abort.
          locked=""
          if [ -f Cargo.lock ]; then
            locked="--locked"
          fi
          cargo build --release $locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          # The archive mirrors the install layout: the binary plus the files
          # that make the icon and app id work on Wayland, where the window
          # icon is ignored and the panel looks up the .desktop entry instead.
          stage="entropy-forge-$TAG-linux-x86_64"
          mkdir -p "$stage/icons/hicolor/256x256/apps"
          cp target/release/entropy-forge "$stage/"
          cp assets/linux/entropy-forge.desktop "$stage/"
          cp LICENSE "$stage/"
          cp assets/icons/128x128@2x.png \
            "$stage/icons/hicolor/256x256/apps/entropy-forge.png"
          tar -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "$stage"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path target/release/entropy-forge.exe, LICENSE `
            -DestinationPath "dist/entropy-forge-$($env:TAG)-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify tag matches Cargo.toml
        run: |
          tag_version="${TAG#v}"
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $crate_version"
            exit 1
          fi

      - name: Extract CHANGELOG section
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for the changes in this version." > release-notes.md
          fi

      - name: Create the release if it does not exist yet
        run: |
          # No waiting on "Release notes": this job can publish the release
          # itself. If that workflow already created it, this is a no-op.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          prerelease=""
          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi

          # The notes workflow may create the release between the check above
          # and this call. Losing that race is fine; only fail if the release
          # is still missing afterwards.
          if ! gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file release-notes.md $prerelease; then
            gh release view "$TAG" > /dev/null
          fi

      - name: Upload binaries
        run: gh release upload "$TAG" dist/* --clobber
