name: Build release assets

# Builds desktop binaries and attaches them to an existing release.
#
# Two ways to trigger it:
#   * push a version tag  -> automatic, right after "Release notes"
#   * Actions -> Run workflow -> rebuild an existing tag (e.g. v0.2.0)
#
# Kept separate from "Release notes" so that a failing build never prevents a
# release record from existing: notes come from CHANGELOG.md, binaries are extra.
#
# Standard runners are free for public repositories, so per-release builds cost
# nothing. A failed build only leaves a red run behind; the release keeps its
# notes and simply gets no assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build for (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu keeps the glibc requirement low; the binary
          # then runs on newer distributions too.
          - os: ubuntu-22.04
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: |
          # Tags created before the lock file was tracked (v0.2.0 and older)
          # have no Cargo.lock, so --locked would abort.
          locked=""
          if [ -f Cargo.lock ]; then
            locked="--locked"
          fi
          cargo build --release $locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          # The archive mirrors the install layout: the binary plus the files
          # that make the icon and app id work on Wayland, where the window
          # icon is ignored and the panel looks up the .desktop entry instead.
          stage="entropy-forge-$TAG-linux-x86_64"
          mkdir -p "$stage/icons/hicolor/256x256/apps"
          cp target/release/entropy-forge "$stage/"
          cp assets/linux/entropy-forge.desktop "$stage/"
          cp LICENSE "$stage/"
          cp assets/icons/128x128@2x.png \
            "$stage/icons/hicolor/256x256/apps/entropy-forge.png"
          tar -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "$stage"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path target/release/entropy-forge.exe, LICENSE `
            -DestinationPath "dist/entropy-forge-$($env:TAG)-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Wait for the release
        run: |
          # "Release notes" runs in parallel and needs only seconds, while the
          # builds take minutes. Wait anyway so that a slow or retried notes run
          # cannot race the upload.
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG exists."
              exit 0
            fi
            echo "Release $TAG not visible yet (attempt $attempt/30), waiting..."
            sleep 10
          done
          echo "::error::Release $TAG was not created within 5 minutes. Check the Release notes run and that CHANGELOG.md has a section for it."
          exit 1

      - name: Upload binaries
        run: gh release upload "$TAG" dist/* --clobber
