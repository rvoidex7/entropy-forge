version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - rust
    groups:
      # One PR for all patch bumps, one for all minor bumps: less noise than a
      # PR per crate.
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor"]
    ignore:
      # egui 0.x bumps are breaking by convention and must be applied by hand
      # together with the GUI code. Patch releases are still allowed.
      - dependency-name: egui
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: eframe
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: egui_kittest
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
      - dependencies
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
