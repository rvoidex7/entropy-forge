# Rustfmt configuration.
#
# Only stable options are listed here. Nightly-only options (for example
# `wrap_comments`, `imports_granularity` and `format_strings`) are intentionally
# omitted so that `cargo fmt --check` runs without warnings on stable rustfmt.

edition = "2021"
max_width = 100
tab_spaces = 4
use_small_heuristics = "Default"
newline_style = "Auto"
reorder_imports = true
fn_params_layout = "Tall"
